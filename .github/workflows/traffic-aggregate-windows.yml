name: Traffic Aggregate Windows Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build'
        required: true
        default: 'traffic-aggregate-memory'
        type: string
  push:
    branches:
      - traffic-aggregate-memory

permissions:
  contents: read
  actions: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Add Rust Target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies and prepare sidecars
        run: |
          pnpm i
          pnpm run prebuild x86_64-pc-windows-msvc

      - name: Disable updater artifacts for unsigned custom build
        shell: pwsh
        run: |
          $tauriPath = "src-tauri/tauri.conf.json"
          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json
          $tauri.version = "2.5.2-traffic.1"
          $tauri.bundle.createUpdaterArtifacts = $false
          $tauri | ConvertTo-Json -Depth 100 | Set-Content $tauriPath -Encoding utf8

          $pkgPath = "package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = "2.5.2-traffic.1"
          $pkg | ConvertTo-Json -Depth 100 | Set-Content $pkgPath -Encoding utf8

      - name: Tauri build (portable, no installer)
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: Make portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triple = "x86_64-pc-windows-msvc"
          $releaseDir = "src-tauri/target/$triple/release"
          $sidecarDir = "src-tauri/sidecar"
          $resourcesSrc = "src-tauri/resources"
          $out = "MailMate-portable-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Write-Host "=== release dir listing ==="
          Get-ChildItem $releaseDir | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "=== sidecar dir listing ==="
          Get-ChildItem $sidecarDir | Select-Object Name, Length | Format-Table -AutoSize

          # Main executable: depending on the Tauri CLI, --no-bundle may leave the
          # cargo bin name (clash-verge.exe) or apply mainBinaryName (MailMate.exe).
          # Detect whichever exists and normalize to MailMate.exe.
          $mainExe = $null
          foreach ($cand in @("MailMate.exe", "clash-verge.exe")) {
            if (Test-Path "$releaseDir/$cand") { $mainExe = "$releaseDir/$cand"; break }
          }
          if (-not $mainExe) {
            $mainExe = (Get-ChildItem "$releaseDir/*.exe" |
              Where-Object { $_.Name -notlike "verge-mihomo*" } |
              Sort-Object Length -Descending | Select-Object -First 1).FullName
          }
          if (-not $mainExe) { throw "main executable not found in $releaseDir" }
          Write-Host "Main exe: $mainExe"
          Copy-Item $mainExe "$out/MailMate.exe" -Force

          # Core sidecar: prebuild places it under src-tauri/sidecar with a target
          # triple suffix; the app looks for it without the suffix, next to the exe.
          $core = Get-ChildItem "$sidecarDir/verge-mihomo-$triple*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "*alpha*" } | Select-Object -First 1
          if (-not $core) {
            $core = Get-ChildItem "$sidecarDir/verge-mihomo*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notlike "*alpha*" } | Select-Object -First 1
          }
          if (-not $core) { throw "core sidecar (verge-mihomo) not found in $sidecarDir" }
          Write-Host "Core sidecar: $($core.FullName)"
          Copy-Item $core.FullName "$out/verge-mihomo.exe" -Force

          $coreAlpha = Get-ChildItem "$sidecarDir/verge-mihomo-alpha-$triple*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($coreAlpha) { Copy-Item $coreAlpha.FullName "$out/verge-mihomo-alpha.exe" -Force }

          # Resources (mmdb / geoip / geosite / service / plugin / dns scripts),
          # resolved at runtime as "<exe dir>/resources".
          if (-not (Test-Path $resourcesSrc)) { throw "resources dir missing: $resourcesSrc" }
          Copy-Item $resourcesSrc "$out/resources" -Recurse -Force

          # Portable flag: presence of .config/PORTABLE switches the app to store
          # all data next to the exe instead of %APPDATA%.
          New-Item -ItemType Directory -Force -Path "$out/.config" | Out-Null
          New-Item -ItemType File -Force -Path "$out/.config/PORTABLE" | Out-Null

          Write-Host "=== Portable package contents ==="
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize

          Compress-Archive -Path "$out/*" -DestinationPath "MailMate-portable-windows-x64.zip" -Force
          Get-ChildItem "MailMate-portable-windows-x64.zip"

      - name: Upload Windows x64 portable
        uses: actions/upload-artifact@v7
        with:
          name: mailmate-portable-windows-x64
          path: MailMate-portable-windows-x64.zip
          if-no-files-found: error
