    body: Switched to {mode}.
  systemProxyToggled:
    title: System Mail Channel
    'on': System account has been enabled.
    'off': System account has been disabled.
  tunModeToggled:
    title: TUN Mode
    'on': TUN mode has been enabled.
    'off': TUN mode has been disabled.
